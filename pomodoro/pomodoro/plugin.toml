id           = "codeloverkawai/pomodoro"
name         = "Pomodoro Pro"
version      = "1.0.0"
plugin_api   = 22
author       = "CodeLoverKawai"
license      = "MIT"
icon         = "brain"
description  = "Pomodoro timer with continuous flow, dynamic session target, and total remaining time breakdown."
tags         = ["bar", "panel", "service", "productivity", "time"]
dependencies = ["ffplay"]

[[setting]]
key             = "work-duration"
type            = "int"
label_key       = "settings.work-duration.label"
description_key = "settings.work-duration.description"
default         = 25
min             = 1

[[setting]]
key             = "short-break-duration"
type            = "int"
label_key       = "settings.short-break-duration.label"
description_key = "settings.short-break-duration.description"
default         = 5
min             = 1

[[setting]]
key             = "long-break-duration"
type            = "int"
label_key       = "settings.long-break-duration.label"
description_key = "settings.long-break-duration.description"
default         = 15
min             = 1

[[setting]]
key             = "default-sessions"
type            = "int"
label_key       = "settings.default-sessions.label"
description_key = "settings.default-sessions.description"
default         = 4
min             = 1

[[setting]]
key             = "auto-start-breaks"
type            = "bool"
label_key       = "settings.auto-start-breaks.label"
description_key = "settings.auto-start-breaks.description"
default         = true

[[setting]]
key             = "auto-start-work"
type            = "bool"
label_key       = "settings.auto-start-work.label"
description_key = "settings.auto-start-work.description"
default         = true

[[setting]]
key             = "enable-work-timer-sound"
type            = "bool"
label_key       = "settings.enable-work-timer-sound.label"
description_key = "settings.enable-work-timer-sound.description"
default         = false

[[setting]]
key             = "work-complete-sound-path"
type            = "file"
label_key       = "settings.work-complete-sound-path.label"
description_key = "settings.work-complete-sound-path.description"
default         = ""

[[setting]]
key             = "break-complete-sound-path"
type            = "file"
label_key       = "settings.break-complete-sound-path.label"
description_key = "settings.break-complete-sound-path.description"
default         = ""

[[setting]]
key             = "use-bundled-alarm-sound"
type            = "bool"
label_key       = "settings.use-bundled-alarm-sound.label"
description_key = "settings.use-bundled-alarm-sound.description"
default         = true

[[setting]]
key             = "bypass-noctalia-sound-globals"
type            = "bool"
label_key       = "settings.bypass-noctalia-sound-globals.label"
description_key = "settings.bypass-noctalia-sound-globals.description"
visible_when    = { key = "use-bundled-alarm-sound", values = ["true"] }
default         = true

[[setting]]
key             = "boost-alarm-volume"
type            = "bool"
label_key       = "settings.boost-alarm-volume.label"
description_key = "settings.boost-alarm-volume.description"
default         = true

[[setting]]
key             = "enable-work-music"
type            = "bool"
label_key       = "settings.enable-work-music.label"
description_key = "settings.enable-work-music.description"
default         = false

[[setting]]
key             = "work-music-path"
type            = "file"
label_key       = "settings.work-music-path.label"
description_key = "settings.work-music-path.description"
visible_when    = { key = "enable-work-music", values = ["true"] }
default         = ""

[[setting]]
key             = "enable-break-music"
type            = "bool"
label_key       = "settings.enable-break-music.label"
description_key = "settings.enable-break-music.description"
default         = false

[[setting]]
key             = "break-music-path"
type            = "file"
label_key       = "settings.break-music-path.label"
description_key = "settings.break-music-path.description"
visible_when    = { key = "enable-break-music", values = ["true"] }
default         = ""

[[widget]]
id    = "widget"
entry = "src/widget.luau"

    [[widget.setting]]
    key             = "widget-glyph-main"
    type            = "glyph"
    label_key       = "settings.widget.glyph-main.label"
    description_key = "settings.widget.glyph-main.description"
    default         = "brain"

    [[widget.setting]]
    key             = "widget-glyph-work"
    type            = "glyph"
    label_key       = "settings.widget.glyph-work.label"
    description_key = "settings.widget.glyph-work.description"
    default         = "brain"

    [[widget.setting]]
    key             = "widget-glyph-break"
    type            = "glyph"
    label_key       = "settings.widget.glyph-break.label"
    description_key = "settings.widget.glyph-break.description"
    default         = "coffee"

[[panel]]
id              = "panel"
entry           = "src/panel.luau"
placement       = "attached"
open_near_click = true
width           = 350
height          = 340

[[service]]
id    = "pomodoro"
entry = "src/pomodoro.luau"
